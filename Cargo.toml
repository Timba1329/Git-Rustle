[workspace]
resolver = "3"
members = ["crates/rustle-core", "crates/rustle-app"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/Timba1329/Git-Rustle"
description = "A fast, native Git client"
publish = false

[workspace.dependencies]
rustle-core = { path = "crates/rustle-core" }

# Fast build/test: own code unoptimised, dependencies (egui, syntect) optimised
[profile.dev]
debug = "line-tables-only"

[profile.dev.package."*"]
opt-level = 2

# Full build: fully optimised and small
[profile.release]
lto = "thin"
codegen-units = 1
strip = true
